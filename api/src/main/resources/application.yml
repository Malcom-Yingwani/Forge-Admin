server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8081}
spring:
  application:
    name: forge-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}
app:
  cors-origins: ${CORS_ORIGINS:}
  sync-shared-secret: ${SYNC_SHARED_SECRET}
  media-dir: ${MEDIA_DIR}
  heritage-sync-url: ${HERITAGE_SYNC_URL}
  jwt-secret: ${JWT_SECRET}
  admin-email: ${ADMIN_EMAIL}
  admin-password: ${ADMIN_PASSWORD}
  media-storage: ${MEDIA_STORAGE}
  media-s3-endpoint: ${MEDIA_S3_ENDPOINT:}
  media-s3-bucket: ${MEDIA_S3_BUCKET:}
  media-s3-region: ${MEDIA_S3_REGION:}
  media-s3-access-key: ${MEDIA_S3_ACCESS_KEY:}
  media-s3-secret-key: ${MEDIA_S3_SECRET_KEY:}

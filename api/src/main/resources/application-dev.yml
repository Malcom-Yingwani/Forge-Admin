spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/forge}
    username: ${DB_USER:forge}
    password: ${DB_PASSWORD:forge}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1026}
  flyway:
    locations: classpath:db/migration,classpath:db/dev
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
app:
  cors-origins: ${CORS_ORIGINS:http://localhost:5174}
  sync-shared-secret: ${SYNC_SHARED_SECRET:dev-secret-change-me}
  media-dir: ${MEDIA_DIR:./media}
  heritage-sync-url: ${HERITAGE_SYNC_URL:http://localhost:8080/internal/sync}
  jwt-secret: ${JWT_SECRET:local-development-only-not-for-production-32bytes}
  admin-email: ${ADMIN_EMAIL:admin@heritage.local}
  admin-password: ${ADMIN_PASSWORD:change-me}
  media-storage: ${MEDIA_STORAGE:s3}
  media-s3-endpoint: ${MEDIA_S3_ENDPOINT:http://localhost:9000}
  media-s3-bucket: ${MEDIA_S3_BUCKET:forge-media}
  media-s3-region: ${MEDIA_S3_REGION:us-east-1}
  media-s3-access-key: ${MEDIA_S3_ACCESS_KEY:forge}
  media-s3-secret-key: ${MEDIA_S3_SECRET_KEY:forge-secret}
  refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
  password-reset-url: ${PASSWORD_RESET_URL:http://localhost:5174/reset-password}
  mail-from: ${MAIL_FROM:forge@heritage.local}

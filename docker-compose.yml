name: forge
services:
  postgres:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forge}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"
  minio:
    image: forge-minio:RELEASE.2025-09-07T16-13-09Z
    pull_policy: never
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-forge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-forge-secret}
      NO_PROXY: localhost,127.0.0.1,minio,postgres,172.16.0.0/12
      no_proxy: localhost,127.0.0.1,minio,postgres,172.16.0.0/12
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
  minio-init:
    image: forge-mc:RELEASE.2025-08-13T08-35-41Z
    pull_policy: never
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-forge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-forge-secret}
      NO_PROXY: localhost,127.0.0.1,minio,postgres,172.16.0.0/12
      no_proxy: localhost,127.0.0.1,minio,postgres,172.16.0.0/12
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for attempt in $$(seq 1 60); do
          if mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; then
            exec mc mb --ignore-existing local/forge-media
          fi
          sleep 1
        done
        echo "MinIO did not become ready" >&2
        exit 1
volumes:
  pgdata:
  minio-data:

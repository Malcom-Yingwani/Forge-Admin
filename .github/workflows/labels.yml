name: Sync labels

on:
  push:
    branches: [main]
    paths: [".github/labels.json", ".github/workflows/labels.yml"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const wanted = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            const { owner, repo } = context.repo;
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 });
            for (const l of wanted) {
              const found = existing.find(e => e.name.toLowerCase() === l.name.toLowerCase());
              if (found) {
                await github.rest.issues.updateLabel({ owner, repo, name: found.name, new_name: l.name, color: l.color, description: l.description });
                core.info(`updated ${l.name}`);
              } else {
                await github.rest.issues.createLabel({ owner, repo, name: l.name, color: l.color, description: l.description });
                core.info(`created ${l.name}`);
              }
            }

name: api
on:
  pull_request:
    paths: ['api/**', '.github/workflows/api.yml', 'infra/minio/**', 'scripts/build-minio.sh']
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api.yml', 'infra/minio/**', 'scripts/build-minio.sh']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: api/pom.xml
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-minio-${{ hashFiles('scripts/build-minio.sh') }}
      - run: ../scripts/build-minio.sh server-only
      - run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            api/target/surefire-reports
            api/target/failsafe-reports
